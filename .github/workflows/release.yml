name: Release Obsidian theme

# Push a tag that equals the version in manifest.json (for example 1.0.1).
# The lint job checks the tag and theme.css with the rules the directory
# review uses. It runs npm code, so it has read access only. The release job
# runs no npm code: it attests the two files and makes a draft release.
# Publish the draft on GitHub after adding release notes.

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi
          test -s theme.css

      - name: Lint theme.css
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install stylelint theme.css

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Attest release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            theme.css
            manifest.json

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            --draft \
            manifest.json theme.css
